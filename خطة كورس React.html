/* Layout: one narrow RTL column. "Next up" card first, then a 16-segment strip (one segment per day), then the days as collapsible rows grouped by video part. */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --ink: #14201F;

    --line: #263634;
    --accent: #45C1B6;
    --accent-ink: #05201E;
    --accent-soft: #12302D;
    --now: #F0A650;

    --late: #E58A7C;
    --late-soft: #35191A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1514;

  --ink: #E5EEED;

  --accent-ink: #05201E;
  --accent-soft: #12302D;
  --now: #F0A650;
  --now-soft: #2A2113;
  --late: #E58A7C;
  --late-soft: #35191A;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.7;
  padding-inline: 16px;
  padding-block: 24px 56px;
}
.wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
.wrap > * { min-width: 0; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
a { color: inherit; }

header { display: flex; flex-direction: column; gap: 8px; }
h1 { font-size: 30px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.lede { color: var(--muted); }
.vids { display: flex; flex-wrap: wrap; gap: 8px; }
.vids a {
  border: 1px solid var(--line); background: var(--surface);

}
.vids a:hover { border-color: var(--accent); color: var(--accent); }

.now {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; display: flex; flex-direction: column; gap: 6px;
}
.eyebrow { color: var(--now); font-weight: 600; font-size: 14px; }
.now h2 { font-size: 22px; font-weight: 600; line-height: 1.4; text-wrap: balance; display: flex; gap: 12px; align-items: baseline; }
.hnum { font-family: var(--font-mono); font-weight: 500; color: var(--now); font-variant-numeric: tabular-nums; }
.hmeta { color: var(--muted); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; min-block-size: 44px;
  padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; font-weight: 500;
  text-decoration: none; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }

.map { display: flex; flex-direction: column; gap: 8px; }
.sum { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sum strong { font-weight: 600; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; }
.seg {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--muted); font: inherit;

.seg i { display: block; inline-size: 100%; block-size: 10px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }

.hint { color: var(--muted); font-size: 14px; }

.chk { position: relative; display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; padding-block: 4px; }
.chk input { position: absolute; opacity: 0; inline-size: 1px; block-size: 1px; }
.box {

.box::after {
  content: ""; inline-size: 6px; block-size: 11px; border: solid var(--accent-ink); border-width: 0 2px 2px 0;

.chk input:checked + .box { background: var(--accent); border-color: var(--accent); }
.chk input:checked + .box::after { opacity: 1; }
.chk input:focus-visible + .box { outline: 2px solid var(--ink); outline-offset: 2px; }

.dfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px 16px; border-top: 1px solid var(--line); }
.mark {

.mark:hover { border-color: var(--accent); color: var(--accent); }
.note { color: var(--muted); font-size: 14px; }

.settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--muted); font-size: 14px; margin-top: 12px; }

#sync { flex-basis: 100%; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 420px) {

    var chapters = [];
    d.r.forEach(function (r) {
      for (var k = r[1]; k <= r[2]; k++) chapters.push({ v: r[0], s: PARTS[r[0]][k][0], t: PARTS[r[0]][k][1] });
    });
    var mixed = chapters.some(function (c) { return c.v !== chapters[0].v; });

    if (GROUPS[n]) daysEl.append(h("h2", { class: "group", text: GROUPS[n] }));

    var det = h("details", { class: "day", id: "day-" + n });
    var dateEl = h("span");
    var badge = h("span", { class: "badge" });
    var count = h("span", { class: "count" });
    var meta = h("span", { class: "dmeta" }, dateEl, " · " + d.dur, d.tag ? " · " + d.tag : null);
    det.append(h("summary", {},
      h("span", { class: "dnum", text: p2(n) }),
      h("span", { class: "dmain" }, h("span", { class: "dtitle", text: d.t }), meta),
      h("span", { class: "dstate" }, badge, count),
      h("span", { class: "chev", "aria-hidden": "true" })
    ));

    var ul = h("ul", { class: "chs" });
    var rows = [], boxes = [], lastV = 0;
    chapters.forEach(function (c, k) {
      if (mixed && c.v !== lastV) {
        ul.append(h("li", { class: "sub", text: c.v === 1 ? "من الجزء الأول" : "من الجزء الثاني" }));
        lastV = c.v;
      }
      var cb = h("input", { type: "checkbox", id: "c-" + n + "-" + k });
      cb.dataset.day = n;
      cb.dataset.i = k;
      var lab = h("label", { class: "chk" }, cb, h("span", { class: "box", "aria-hidden": "true" }),
        h("bdi", { class: "t", dir: "auto", text: c.t }));
      var a = h("a", { class: "ts", href: link(c.v, c.s), target: "_blank", rel: "noopener", dir: "ltr",
        "aria-label": "افتح الفيديو عند " + ts(c.s) }, ts(c.s));
      var li = h("li", {}, lab, a);
      ul.append(li);
      rows.push(li);
      boxes.push(cb);
    });

    var mark = h("button", { type: "button", class: "mark" });
    mark.dataset.day = n;
    det.append(h("div", { class: "dbody" }, ul,
      h("div", { class: "dfoot" }, mark, d.note ? h("p", { class: "note", text: d.note }) : null)));
    daysEl.append(det);

    var seg = h("button", { type: "button", class: "seg", "aria-label": "اليوم " + n, title: "اليوم " + n },
      h("i"), h("span", { class: "sn", text: String(n) }));
    seg.dataset.day = n;
    stripEl.append(seg);

    refs[n] = { det: det, date: dateEl, badge: badge, count: count, mark: mark, rows: rows, boxes: boxes,
      chapters: chapters, seg: seg, done: 0 };
  });

  // ---------- render ----------
  function refresh() {
    var today = iso(new Date());
    var total = 0, doneAll = 0, next = null;
    DAYS.forEach(function (d, i) {
      var n = i + 1, r = refs[n], done = 0;
      r.chapters.forEach(function (c, k) {
        var on = !!state.done[n + "." + k];
        r.boxes[k].checked = on;
        r.rows[k].classList.toggle("on", on);
        if (on) done++;
      });
      r.done = done;
      total += r.chapters.length;
      doneAll += done;
      var complete = done === r.chapters.length;
      var dt = dayDate(n), di = iso(dt);
      r.det.classList.toggle("complete", complete);
      r.date.textContent = dateLabel(dt);
      r.count.textContent = done + "/" + r.chapters.length;
      r.mark.textContent = complete ? "شيل التعليم عن اليوم" : "علّم اليوم كله";
      var b = complete ? ["ok", "خلص"] : di === today ? ["now", "النهارده"] : di < today ? ["late", "متأخر"] : ["", ""];
      r.badge.className = "badge" + (b[0] ? " " + b[0] : "");
      r.badge.textContent = b[1];
      r.seg.firstChild.style.setProperty("--p", (done / r.chapters.length * 100) + "%");
      if (!complete && next === null) next = n;
    });
    currentNext = next;
    DAYS.forEach(function (d, i) { refs[i + 1].seg.classList.toggle("current", i + 1 === next); });

    overallEl.textContent = "خلصت " + doneAll + " من " + total + " فصل";
    pctEl.textContent = Math.round(doneAll / total * 100) + "%";
    if (startEl.value !== state.start) startEl.value = state.start;
    renderNow(next);
  }

  function renderNow(next) {
    nowEl.textContent = "";
    if (!next) {
      nowEl.append(h("p", { class: "eyebrow", text: "خلصت" }),
        h("h2", { text: "كل الأيام الـ16 اتعلّمت." }));
      return;
    }
    var r = refs[next], d = DAYS[next - 1];
    var idx = 0;
    for (var k = 0; k < r.chapters.length; k++) { if (!state.done[next + "." + k]) { idx = k; break; } }
    var c = r.chapters[idx], started = r.done > 0, left = r.chapters.length - r.done;
    nowEl.append(
      h("p", { class: "eyebrow", text: "المطلوب الآن" }),
      h("h2", {}, h("span", { class: "hnum", text: p2(next) }), d.t),
      h("p", { class: "hmeta", text: dateLabel(dayDate(next)) + " · " + d.dur + " · باقي " + left + " من " + r.chapters.length + " فصل" }),
      h("div", { class: "actions" },
        h("a", { class: "btn primary", href: link(c.v, c.s), target: "_blank", rel: "noopener" },
          started ? "كمّل من: " : "ابدأ من: ", h("bdi", { dir: "auto", text: c.t }), " ↗"),
        h("button", { class: "btn", type: "button", "data-open": String(next), text: "افتح اليوم" }))
    );
  }

  function openDay(n) {
    var r = refs[n];
    if (!r) return;
    r.det.open = true;
    var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    r.det.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  }
  function openCurrent() {
    if (opened) return;
    opened = true;
    if (currentNext) refs[currentNext].det.open = true;
  }

  // ---------- saving ----------
  function mirror() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
  function save() {
    dirty = true;
    mirror();
    if (!ref) return;
    clearTimeout(timer);
    timer = setTimeout(flush, 500);
  }
  function flush() {
    if (!ref) return;
    if (writing) { timer = setTimeout(flush, 300); return; }
    writing = true;
    var sent = JSON.stringify(state);
    ref.set({ done: state.done, start: state.start }).then(function () {
      writing = false;
      if (JSON.stringify(state) === sent) { dirty = false; setSync("cloud"); }
      else timer = setTimeout(flush, 100);
    }, function () {
      writing = false;
      setSync("error");
    });
  }

  // ---------- events ----------
  daysEl.addEventListener("change", function (e) {
    var t = e.target;
    if (!t || t.type !== "checkbox") return;
    var key = t.dataset.day + "." + t.dataset.i;
    if (t.checked) state.done[key] = true; else delete state.done[key];
    save();
    refresh();
  });
  daysEl.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".mark") : null;
    if (!b) return;
    var n = +b.dataset.day, r = refs[n];
    var all = r.chapters.every(function (c, k) { return state.done[n + "." + k]; });
    r.chapters.forEach(function (c, k) {
      if (all) delete state.done[n + "." + k]; else state.done[n + "." + k] = true;
    });
    save();
    refresh();
  });
  stripEl.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".seg") : null;
    if (b) openDay(+b.dataset.day);
  });
  nowEl.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-open]") : null;
    if (b) openDay(+b.getAttribute("data-open"));
  });
  startEl.addEventListener("change", function () {
    if (!parseISO(startEl.value)) return;
    state.start = startEl.value;
    save();
    refresh();
  });

  // ---------- start ----------
  startEl.value = state.start;
  setSync("local");
  refresh();
  openCurrent();

  function hasProgress() { return Object.keys(state.done).length > 0 || state.start !== DEFAULT_START; }

  function attach() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") return;
    Promise.all([c.use("user"), c.use("db")]).then(function (res) {
      var user = res[0], db = res[1];
      if (!user || !db) return null;
      return user.id().then(function (uid) {
        if (!uid) return null;
        ref = db.doc("data/users/" + uid + "/progress");
        ref.onSnapshot(function (snap) {
          if (!snap.exists) {
            setSync("cloud");
            if (hasProgress()) { dirty = true; flush(); }
            return;
          }
          if (dirty) return;
          var d = snap.data() || {};
          state.done = (d.done && typeof d.done === "object") ? Object.assign({}, d.done) : {};
          state.start = parseISO(d.start) ? d.start : DEFAULT_START;
          mirror();
          refresh();
          openCurrent();
          setSync("cloud");
        }, function () { ref = null; setSync("local"); });
      });
    }).catch(function () { setSync("local"); });
  }
  attach();
})();
</script>

</body></html>
